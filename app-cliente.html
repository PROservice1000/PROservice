<style>
:root{--blue:#023072;--orange:#fd6106;--orange-d:#e25400;--navy:#102750;--paper:#f7f8fb;--line:#e4e8ef;--muted:#6b778c;--white:#fff;--green:#16885c;--red:#c93c3c;--r:14px;--shadow:0 1px 2px #10275010,0 8px 24px #1027500d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}body{margin:0;background:#e9edf3;color:var(--navy);font:14px/1.45 "Plus Jakarta Sans",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:440px;min-height:100dvh;margin:auto;background:var(--paper);position:relative;box-shadow:0 0 40px #001b4220;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:0;z-index:4;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 12px;background:#ffffffee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:42px;height:42px;object-fit:contain}.brand strong{display:block;color:var(--blue);font-size:15px;line-height:1.1}.brand small{color:var(--muted);font-size:11px}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:12px;width:40px;height:40px;color:var(--blue);display:grid;place-items:center}
main{padding:22px 18px 28px;animation:in .25s ease}@keyframes in{from{opacity:0;transform:translateY(6px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.eyebrow{font-size:12px;color:var(--orange);font-weight:700}.heading{font-size:24px;line-height:1.2;margin:4px 0 8px;color:var(--blue);font-weight:800;letter-spacing:-.4px}.sub{color:var(--muted);font-size:13px;line-height:1.55;margin:0 0 18px}
.hero{background:linear-gradient(135deg,#023072,#0a4aa8);color:#fff;border-radius:20px;padding:22px;position:relative;overflow:hidden;margin:18px 0 8px;box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;width:170px;height:170px;border:24px solid #ffffff12;border-radius:50%;right:-55px;top:-70px}
.hero h2{font-size:20px;margin:0 0 6px;max-width:240px;letter-spacing:-.3px}.hero p{font-size:12px;color:#d7e3f5;max-width:250px;margin:0 0 16px}
.btn-o{background:var(--orange);color:#fff;border-radius:12px;padding:12px 16px;font-weight:700;display:inline-flex;gap:8px;align-items:center}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 6px;padding:8px 0}.chips span{white-space:normal;text-align:center;line-height:1.25;font-size:11px;font-weight:600;color:var(--blue);background:#fff;border:1px solid var(--line);border-radius:20px;padding:7px 10px;display:flex;gap:6px;align-items:center;justify-content:center;min-width:0}.chips .i{flex:none}.chips .i{color:var(--green)}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}.section-title h3{font-size:15px;margin:0;color:var(--blue)}.link{font-size:12px;color:var(--orange);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.service{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 13px;text-align:left;min-height:128px;transition:.15s;box-shadow:var(--shadow)}.service:hover,.service.selected{border-color:var(--orange)}.service:active{transform:scale(.98)}
.ico{width:40px;height:40px;border-radius:12px;background:#fff1e8;color:var(--orange);display:grid;place-items:center;margin-bottom:11px}
.service b{font-size:13px;line-height:1.3;display:block;color:var(--blue)}.service small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:11px;line-height:1.4;margin-top:4px}
.bottom,.cta{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(440px,100%);background:#fff;border-top:1px solid var(--line);z-index:5;padding-bottom:env(safe-area-inset-bottom,0px)}
.bottom{display:grid;grid-template-columns:repeat(5,1fr);height:calc(68px + env(safe-area-inset-bottom,0px))}.bottom button{color:#8590a2;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.bottom button.active{color:var(--orange)}
.cta{padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px))}

.secondary{width:100%;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;color:var(--blue);font-weight:700;margin-top:10px;display:flex;justify-content:center;gap:8px;align-items:center}.danger{color:var(--red)}
.flowbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}.flowbar .iconbtn{width:36px;height:36px}.steps{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.steps i{height:4px;border-radius:4px;background:var(--line)}.steps i.on{background:var(--orange)}.stepn{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:600;color:#44526b;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px;outline:none;font-size:14px}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--orange);box-shadow:0 0 0 3px #fd61061a}.err{color:var(--red);font-size:12px;margin:8px 0 0;min-height:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:11px;box-shadow:var(--shadow)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{color:var(--muted);font-size:12px}.price{color:var(--orange);font-weight:800}
.pro{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:10px}.pro.selected{border-color:var(--orange);background:#fff8f2}.avatar{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid #c3cad6;display:grid;place-items:center;flex:none}.selected .radio{border-color:var(--orange);background:radial-gradient(var(--orange) 45%,transparent 50%)}
.date-strip{display:flex;gap:8px;overflow-x:auto;margin:12px -18px 6px;padding:2px 18px;scrollbar-width:none}.date{flex:none;width:58px;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 2px;text-align:center;font-size:11px;color:var(--muted);text-transform:capitalize}.date b{display:block;font-size:18px;color:var(--navy);margin:2px 0}.date.selected{background:var(--blue);border-color:var(--blue);color:#d7e3f5}.date.selected b{color:#fff}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.time{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:12px 4px;color:var(--blue);font-weight:700;font-size:13px}.time.selected{background:var(--orange);border-color:var(--orange);color:#fff}
.summaryline{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}.summaryline:last-child{border:0}.summaryline span{color:var(--muted)}.summaryline b{text-align:right}
.status{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:700;white-space:nowrap;background:#fff3e9;color:#b25a1e}.status.ok{background:#e5f6ed;color:var(--green)}.status.no{background:#fdeaea;color:var(--red)}
.notice{padding:12px 13px;border-radius:12px;background:#eef3fb;color:#34507f;font-size:12px;line-height:1.55;margin:14px 0;display:flex;gap:10px}.notice .i{margin-top:1px;color:var(--blue)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#e9edf3;border-radius:12px;padding:4px;margin-bottom:16px}.tabs button{padding:10px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}.tabs .on{background:#fff;color:var(--blue);box-shadow:var(--shadow)}
.appt{width:100%;text-align:left;display:block}.appt .ico{width:36px;height:36px;margin:0}.appt .row+.row{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}.empty .ico{margin:0 auto 12px;width:56px;height:56px;border-radius:50%}.empty b{color:var(--blue);display:block;margin-bottom:4px;font-size:15px}.empty p{margin:0 0 18px}
.login-wrap{padding:calc(30px + env(safe-area-inset-top,0px)) 22px 30px;text-align:center}.login-logo{width:150px;height:150px;object-fit:contain;margin:6px auto 14px;display:block}
.profile-head{text-align:center;padding:6px 0 18px}.profile-head .avatar{width:72px;height:72px;margin:0 auto 10px;font-size:22px}.profile-head b{font-size:17px;color:var(--blue)}
.menuitem{width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:#fff;padding:15px;margin:0 0 8px;display:flex;align-items:center;gap:12px;font-weight:600}.menuitem .i:first-child{color:var(--blue)}.menuitem span{margin-left:auto;color:#a3adbd;display:flex}
.tl{margin:4px 0 0;padding:0;list-style:none}.tl li{display:flex;gap:12px;padding-bottom:16px;position:relative;font-size:13px}.tl li:not(:last-child):before{content:"";position:absolute;left:11px;top:24px;bottom:2px;width:2px;background:var(--line)}.dot{width:24px;height:24px;border-radius:50%;background:#e9edf3;color:#9aa5b8;display:grid;place-items:center;flex:none}.done .dot{background:var(--green);color:#fff}.tl small{display:block;color:var(--muted);font-size:12px}
.crop{position:fixed;inset:0;background:#0a1630b3;z-index:20;display:flex;align-items:flex-end;justify-content:center}.crop .sheet{background:#fff;width:min(440px,100%);border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));text-align:center;animation:in .25s ease}.crop h3{margin:0 0 4px;color:var(--blue);font-size:17px}.crop canvas{width:260px;height:260px;border-radius:50%;margin:16px auto;display:block;touch-action:none;cursor:grab;box-shadow:0 0 0 3px var(--orange),0 0 0 7px #fd610626;background:#eee}.zoom{display:flex;align-items:center;gap:12px;color:var(--muted);margin:6px 0 18px}.zoom input{flex:1;accent-color:var(--orange)}
.avwrap{position:relative;display:block;width:84px;height:84px;margin:0 auto 10px;border-radius:50%}.avwrap .avatar{width:84px;height:84px;margin:0;font-size:24px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.avcam{position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;border:3px solid var(--paper)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#102750;color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;z-index:10;display:none;max-width:90%;text-align:center}
.okcircle{width:76px;height:76px;border-radius:50%;background:#e5f6ed;color:var(--green);display:grid;place-items:center;margin:0 auto 20px}
@media(min-width:600px){body{padding:22px 0}.app{min-height:850px;border-radius:28px;overflow:clip}.bottom,.cta{bottom:22px;border-radius:0 0 28px 28px}}

.app:has(.cover){padding-bottom:0}
.cover{min-height:100dvh;display:flex;flex-direction:column;background:#fff}
.cv-band{background:var(--blue);color:#fff;padding:calc(26px + env(safe-area-inset-top,0px)) 22px 20px;border-bottom:5px solid var(--orange)}
.cv-band h1{margin:0 0 4px;font-size:21px;line-height:1.2;font-weight:800;letter-spacing:-.4px}.cv-band p{margin:0;font-size:12.5px;line-height:1.5;color:#cfdcf2;max-width:330px}
.cv-logo{text-align:center;padding:18px 20px 0}.cv-logo img{width:min(220px,58vw);height:auto;aspect-ratio:1;object-fit:contain;animation:cvin .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes cvin{from{opacity:0;transform:scale(.92) translateY(8px)}}
.cv-slogan{font-family:"Kaushan Script","Segoe Script",cursive;font-size:25px;color:var(--blue);text-align:center;margin:0 auto 18px;position:relative;width:max-content;max-width:100%;padding-bottom:7px}
.cv-slogan:after{content:"";position:absolute;left:4%;right:4%;bottom:0;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--orange) 25%,var(--orange) 75%,transparent)}
.cv-loyal{list-style:none;margin:0 18px;padding:4px 16px;background:var(--blue);border-radius:18px;box-shadow:var(--shadow)}
.cv-loyal li{display:flex;gap:12px;align-items:center;padding:13px 0;color:#fff}.cv-loyal li+li{border-top:1px solid #ffffff1f}
.cv-loyal .b{width:38px;height:38px;border-radius:12px;background:var(--orange);display:grid;place-items:center;flex:none}
.cv-loyal b{display:block;font-size:13px;line-height:1.3}.cv-loyal small{display:block;font-size:11.5px;line-height:1.45;color:#c9d6ee;margin-top:1px}
.cv-svc-t{margin:22px 18px 12px;text-align:center;font-size:13px;font-weight:700;color:var(--blue)}
.cv-svc{list-style:none;margin:0 14px;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px}
.cv-svc li{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:10.5px;font-weight:600;line-height:1.25;color:var(--navy)}
.cv-svc .c{width:46px;height:46px;border-radius:50%;border:2px solid var(--blue);color:var(--blue);display:grid;place-items:center}
.cv-cta{margin-top:auto;padding:26px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.cv-link{display:block;width:100%;text-align:center;margin-top:12px;font-weight:700;font-size:13px;color:var(--blue);padding:8px}
@media(min-width:600px){.cover{min-height:850px}}

/* ===== Fotos do serviço ===== */
.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.ph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#eef1f6}

.card .secondary{margin-top:12px}.card .field{margin:12px 0 0}

.pf-eyebrow{font-size:11px;letter-spacing:.9px;text-transform:uppercase;font-weight:800;color:#00bcc6}
.pf-title{display:flex;align-items:center;gap:10px;margin:6px 0 4px}.pf-title .ico{margin:0;width:36px;height:36px;background:#d9f6f8;color:#00a9b3}.pf-title h1{margin:0;font-size:24px;line-height:1.1;color:var(--navy);font-weight:800;letter-spacing:-.4px}

.pf-box .field input:focus,.pf-box .field select:focus,.pf-search:focus-within{border-color:#00bcc6;box-shadow:0 0 0 3px #00bcc620}
.pf-add{background:#00c4cc;color:#0b1b3a;font-weight:800;box-shadow:none;border-radius:10px;padding:13px 16px}.pf-add:active{background:#00aab2}
.pf-search{display:flex;align-items:stretch;border:1px solid #d5dbe5;border-radius:10px;background:#fff;overflow:hidden}.pf-search>span{display:grid;place-items:center;width:40px;border-right:1px solid #d5dbe5;color:#5b6880}.pf-search input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:11px 12px;font-size:13px}
.pf-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pf-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.pf-card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#eef1f6}
.pf-b{padding:10px 10px 11px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}.pf-b b{font-size:12.5px;line-height:1.3;color:var(--navy);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.pf-b small{font-size:10.5px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-act{display:flex;gap:6px;width:100%;margin-top:2px}.pf-act button{flex:1;background:#eef1f6;border-radius:9px;padding:7px 4px;font-size:12px;font-weight:600;color:var(--blue)}.pf-act button:last-child{color:var(--blue)}
</style></head>

let cr=null;
function openCrop(src,ox=0,oy=0,z=1){const im=new Image();im.onload=()=>{cr={im,src,ox,oy,z};showCrop()};im.onerror=()=>toast("Não foi possível ler a imagem");im.src=src}
function adjustPhoto(){const u=state.user,p=u.photoPos||[0,0,1];openCrop(u.photoSrc||u.photo,...p)}
function clampCrop(){const{im}=cr,s=260/Math.min(im.width,im.height)*cr.z,mx=Math.max(0,(im.width*s-260)/2),my=Math.max(0,(im.height*s-260)/2);cr.ox=Math.max(-mx,Math.min(mx,cr.ox));cr.oy=Math.max(-my,Math.min(my,cr.oy))}
function drawCrop(S=260,c=document.getElementById("cv").getContext("2d")){const{im,ox,oy,z}=cr,k=S/260,s=260/Math.min(im.width,im.height)*z*k;c.fillStyle="#fff";c.fillRect(0,0,S,S);c.drawImage(im,S/2+ox*k-im.width*s/2,S/2+oy*k-im.height*s/2,im.width*s,im.height*s)}
function showCrop(){let o=document.getElementById("crop");if(!o){o=document.createElement("div");o.id="crop";o.className="crop";document.body.appendChild(o)}
 o.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="Ajustar foto"><h3>Ajustar foto</h3><p class="muted" style="margin:0">Arraste para centralizar e use o controle para ampliar.</p><canvas id="cv" width="260" height="260"></canvas><div class="zoom">${I("minus",18)}<input type="range" min="1" max="3" step="0.01" value="${cr.z}" aria-label="Zoom" oninput="cr.z=+this.value;clampCrop();drawCrop()">${I("plus",18)}</div><div class="grid"><button class="secondary" style="margin:0" onclick="closeCrop()">Cancelar</button><button class="primary" onclick="applyCrop()">Salvar</button></div></div>`;
 const c=document.getElementById("cv");let p=null;c.onpointerdown=e=>{p=[e.clientX,e.clientY];c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!p)return;cr.ox+=e.clientX-p[0];cr.oy+=e.clientY-p[1];p=[e.clientX,e.clientY];clampCrop();drawCrop()};c.onpointerup=c.onpointercancel=()=>{p=null};clampCrop();drawCrop()}
function closeCrop(){document.getElementById("crop")?.remove();cr=null}
function applyCrop(){const c=document.createElement("canvas");c.width=c.height=256;drawCrop(256,c.getContext("2d"));Object.assign(state.user,{photo:c.toDataURL("image/jpeg",.85),photoSrc:cr.src,photoPos:[cr.ox,cr.oy,cr.z]});closeCrop();persistUser();toast("Foto atualizada");render()}

function setPhoto(inp){const f=inp.files[0];inp.value="";if(!f)return;if(!f.type.startsWith("image/"))return toast("Selecione um arquivo de imagem");const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);openCrop(c.toDataURL("image/jpeg",.85))};im.onerror=()=>toast("Não foi possível ler a imagem");im.src=r.result};r.readAsDataURL(f)}

/* ===== Fotos do serviço (enviadas pelo cliente -> aparecem no Dashboard > Fotos) =====
   Gravadas em localStorage["proPhotos"], lista de objetos:
   {id, appt, os, client, service, title, category, date(ISO), src(dataURL jpeg), origin:"cliente"} */
const PH_MAX=6,PH_APPT=12,PH_CATS=["Antes","Durante","Depois","Outros"];
const photos=()=>{const l=load("proPhotos",[]);return Array.isArray(l)?l:[]};
function savePhotos(l){try{localStorage.setItem("proPhotos",JSON.stringify(l));return true}catch(e){return false}}
function readImg(f){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.72))};im.src=r.result};r.readAsDataURL(f)})}

  srcs.forEach((src,i)=>l.unshift({id:"ph"+Date.now().toString(36)+i+Math.random().toString(36).slice(2,5),appt:a.id,os:a.protocol,client:u.name||"Cliente",email:u.email||"",service:a.service,title:a.service+" • "+a.protocol,category:cat,date:now,src,origin:"cliente"}));
  return savePhotos(l)}
async function pickPhotos(inp,id){const fs=[...inp.files].filter(f=>f.type.startsWith("image/"));inp.value="";if(!fs.length)return toast("Selecione um arquivo de imagem");
  const a=id?state.appointments.find(x=>x.id===id):null;
  const room=a?PH_APPT-photos().filter(p=>p.appt===a.id).length:PH_MAX-state.d.photos.length;
  if(room<=0)return toast("Limite de fotos atingido");
  if(fs.length>room)toast("Só foi possível adicionar "+room+" foto"+(room>1?"s":""));else toast("Processando...");
  const out=[];for(const f of fs.slice(0,room)){try{out.push(await readImg(f))}catch(e){}}
  if(!out.length)return toast("Não foi possível ler a imagem");
  if(a){if(!addPhotos(a,out,state.phCat||"Antes"))return toast("Sem espaço para salvar as fotos. Remova alguma e tente de novo.");
    a.photoCount=photos().filter(p=>p.appt===a.id).length;store("proAppointments",state.appointments);toast(out.length>1?"Fotos enviadas":"Foto enviada")}
  else state.d.photos.push(...out);
  render()}

function mine(){const u=state.user||{};return photos().filter(p=>p.email?p.email===u.email:(p.client||"").toLowerCase()===(u.name||"").toLowerCase())}
function photosPage(){const pf=state.pf||(state.pf={cat:"Antes",q:"",f:"Todas",os:""});
  shell(`<div class="pf-eyebrow">Atendimento</div><div class="pf-title"><span class="ico">${I("photo",20)}</span><h1>Fotos</h1></div><p class="sub">Registre o antes e depois dos serviços e organize por cliente e categoria.</p>
<div class="card pf-box"><div class="field" style="margin-top:0"><label for="pcat">Categoria</label><select id="pcat" onchange="state.pf.cat=this.value">${PH_CATS.map(c=>`<option ${pf.cat===c?"selected":""}>${c}</option>`).join("")}</select></div><div class="field"><label for="pos">Cliente / OS <span class="muted">(opcional)</span></label><input id="pos" placeholder="Nome do cliente ou nº da OS" value="${esc(pf.os)}" oninput="state.pf.os=this.value"></div><div class="field"><label>Imagens</label><button class="primary pf-add" style="margin-top:0" onclick="document.getElementById('pfile').click()">${I("plus",18)}Adicionar fotos</button></div><input id="pfile" type="file" accept="image/*" multiple hidden onchange="pickFotos(this)"></div>
<div class="card pf-box"><div class="pf-search"><span><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></span><input id="pq" type="search" placeholder="Buscar por legenda ou cliente..." aria-label="Buscar por legenda ou cliente" value="${esc(pf.q)}" oninput="state.pf.q=this.value;fotoGrid()"></div><div class="pf-chips" role="group" aria-label="Filtrar por categoria">${["Todas",...PH_CATS].map(c=>`<button class="${pf.f===c?"on":""}" onclick="state.pf.f='${c}';photosPage()">${c}</button>`).join("")}</div></div><div id="pgrid"></div>`);fotoGrid()}
function fotoGrid(){const el=document.getElementById("pgrid");if(!el)return;const pf=state.pf,q=(pf.q||"").trim().toLowerCase();
  const l=mine().filter(p=>(pf.f==="Todas"||p.category===pf.f)&&(!q||((p.title||"")+" "+(p.client||"")+" "+(p.os||"")).toLowerCase().includes(q)));
  el.innerHTML=l.length?`<div class="pf-grid">${l.map(p=>`<div class="pf-card"><img src="${p.src}" alt="${esc(p.title)}"><div class="pf-b"><b title="${esc(p.title)}">${esc(p.title)}</b><span class="pf-tag">${esc(p.category)}</span><small>${esc(p.client||"")} · ${new Date(p.date).toLocaleDateString("pt-BR")}</small><div class="pf-act"><button onclick="dlFoto('${p.id}')">Baixar</button><button onclick="delFoto('${p.id}')">Excluir</button></div></div></div>`).join("")}</div>`:`<div class="empty"><div class="ico">${I("photo",26)}</div><b>Nenhuma foto encontrada</b><p>Adicione fotos acima para começar.</p></div>`}
async function pickFotos(inp){const fs=[...inp.files].filter(f=>f.type.startsWith("image/"));inp.value="";if(!fs.length)return toast("Selecione um arquivo de imagem");toast("Processando...");
  const out=[];for(const f of fs.slice(0,12)){try{out.push(await readImg(f))}catch(e){}}
  if(!out.length)return toast("Não foi possível ler a imagem");
  const u=state.user||{},pf=state.pf,os=(pf.os||"").trim(),ap=state.appointments.find(a=>os&&a.protocol.toLowerCase()===os.toLowerCase()),l=photos(),n=mine().length,now=new Date().toISOString();
  out.forEach((src,i)=>l.unshift({id:"ph"+Date.now().toString(36)+i+Math.random().toString(36).slice(2,5),appt:ap?ap.id:null,os,client:u.name||"Cliente",email:u.email||"",service:ap?ap.service:"",title:(ap?ap.service:"Foto do serviço")+"-"+(n+i+1),category:pf.cat,date:now,src,origin:"cliente"}));
  if(!savePhotos(l))return toast("Sem espaço para salvar as fotos. Exclua alguma e tente de novo.");
  if(ap){ap.photoCount=l.filter(p=>p.appt===ap.id).length;store("proAppointments",state.appointments)}
  toast(out.length>1?"Fotos enviadas":"Foto enviada");fotoGrid()}
function dlFoto(id){const p=photos().find(x=>x.id===id);if(!p)return;const a=document.createElement("a");a.href=p.src;a.download=(p.title||"foto").replace(/[^\w\-]+/g,"_")+".jpg";document.body.appendChild(a);a.click();a.remove()}
function delFoto(id){if(!confirm("Excluir esta foto?"))return;const l=photos().filter(p=>p.id!==id);savePhotos(l);state.appointments.forEach(a=>{if(a.photoCount!=null)a.photoCount=l.filter(p=>p.appt===a.id).length});store("proAppointments",state.appointments);toast("Foto excluída");fotoGrid()}
function logout(){try{localStorage.removeItem("proUser");sessionStorage.removeItem("proUser")}catch(e){}state.user=null;go("welcome")}
function edit(){const u=state.user||{};app.innerHTML=`<main><button class="iconbtn" aria-label="Voltar" onclick="goTab('perfil')">${I("back")}</button><h1 class="heading" style="margin-top:14px">Dados pessoais</h1><p class="sub">Mantenha seu contato atualizado para a confirmação dos serviços.</p><form onsubmit="saveEdit(event)" novalidate><div class="field"><label for="n">Nome completo</label><input id="n" value="${esc(u.name)}" autocomplete="name"></div><div class="field"><label for="p">Telefone / WhatsApp</label><input id="p" value="${esc(u.phone||"")}" inputmode="tel" placeholder="(00) 00000-0000" oninput="this.value=mask(this.value)"></div><div class="field"><label for="e">E-mail</label><input id="e" type="email" value="${esc(u.email)}"></div><p class="err" id="err" role="alert"></p><button class="primary">Salvar alterações</button></form></main>`}
function saveEdit(e){e.preventDefault();const v=id=>document.getElementById(id).value.trim();if(v("n").length<2)return document.getElementById("err").textContent="Informe seu nome.";if(!/^\S+@\S+\.\S+$/.test(v("e")))return document.getElementById("err").textContent="Informe um e-mail válido.";const prev=state.user.email;state.user={...state.user,name:v("n"),phone:v("p"),email:v("e")};store("proUsers",[...load("proUsers",[]).filter(u=>u.email!==prev),state.user]);void 0;toast("Dados atualizados");goTab("perfil")}
function settings(){const u=state.user||{};app.innerHTML=`<main><button class="iconbtn" aria-label="Voltar" onclick="goTab('perfil')">${I("back")}</button><h1 class="heading" style="margin-top:14px">Configurações do app</h1><p class="sub">Gerencie o acesso à sua conta.</p><form class="card" style="margin-top:14px" onsubmit="saveLogin(event)" novalidate><b>Alterar login</b><p class="muted" style="margin:4px 0 0">Login atual: ${esc(u.email)}</p><div class="field"><label for="cl-e">Novo e-mail</label><input id="cl-e" type="email" autocomplete="off" placeholder="novo@email.com"></div><div class="field"><label for="cl-p">Senha atual</label><input id="cl-p" type="password" autocomplete="current-password" placeholder="Sua senha atual"></div><p class="err" id="err-l" role="alert"></p><button class="primary">Salvar novo login</button></form><form class="card" style="margin-top:14px" onsubmit="savePass(event)" novalidate><b>Alterar senha</b><div class="field"><label for="cs-a">Senha atual</label><input id="cs-a" type="password" autocomplete="current-password" placeholder="Sua senha atual"></div><div class="field"><label for="cs-n">Nova senha</label><input id="cs-n" type="password" autocomplete="new-password" placeholder="Mínimo de 6 caracteres"></div><div class="field"><label for="cs-c">Confirmar nova senha</label><input id="cs-c" type="password" autocomplete="new-password" placeholder="Repita a nova senha"></div><p class="err" id="err-s" role="alert"></p><button class="primary">Salvar nova senha</button></form>${adminWA()}</main>`}
function adminWA(){const u=state.user||{};if((u.email||"").toLowerCase()!==ADMIN_EMAIL)return"";return `<form class="card" style="margin-top:14px" onsubmit="saveWA(event)" novalidate><b>WhatsApp de atendimento</b><p class="muted" style="margin:4px 0 0">Número que recebe as mensagens dos clientes (Ajuda e suporte e agendamentos). Atual: ${esc(mask(WA.replace(/^55/,"")))}</p><div class="field"><label for="cw-n">Novo número com DDD</label><input id="cw-n" inputmode="tel" autocomplete="off" placeholder="(00) 00000-0000" oninput="this.value=mask(this.value)"></div><p class="err" id="err-w" role="alert"></p><button class="primary">Salvar número</button><button type="button" class="link" style="display:block;margin:10px auto 0" onclick="resetWA()">Restaurar número padrão</button></form>`}
function saveWA(e){e.preventDefault();const d=document.getElementById("cw-n").value.replace(/\D/g,""),er=m=>{document.getElementById("err-w").textContent=m};er("");
 if((state.user?.email||"").toLowerCase()!==ADMIN_EMAIL)return er("Sem permissão para alterar este número.");
 if(d.length<10||d.length>11)return er("Informe um número válido com DDD.");
 WA="55"+d;try{localStorage.setItem("proWA",WA)}catch(x){}toast("WhatsApp atualizado");settings()}
function resetWA(){if((state.user?.email||"").toLowerCase()!==ADMIN_EMAIL)return;WA=WA_DEFAULT;try{localStorage.removeItem("proWA")}catch(x){}toast("Número padrão restaurado");settings()}
function saveLogin(e){e.preventDefault();const g=id=>document.getElementById(id).value,er=m=>{document.getElementById("err-l").textContent=m},ne=g("cl-e").trim(),pw=g("cl-p"),u=state.user;er("");
 if(!/^\S+@\S+\.\S+$/.test(ne))return er("Informe um e-mail válido.");
 if(ne.toLowerCase()===u.email.toLowerCase())return er("O novo e-mail é igual ao atual.");
 if(u.ph!==pwHash(pw))return er("Senha atual incorreta.");
 const us=load("proUsers",[]);if(us.some(x=>x.email.toLowerCase()===ne.toLowerCase()&&x.email!==u.email))return er("Este e-mail já está em uso por outra conta.");
 const prev=u.email;state.user={...u,email:ne};store("proUsers",[...us.filter(x=>x.email!==prev),state.user]);
 const l=photos();if(l.some(p=>p.email===prev)){l.forEach(p=>{if(p.email===prev)p.email=ne});savePhotos(l)}
 toast("Login atualizado");settings()}
function savePass(e){e.preventDefault();const g=id=>document.getElementById(id).value,er=m=>{document.getElementById("err-s").textContent=m},cur=g("cs-a"),n1=g("cs-n"),n2=g("cs-c"),u=state.user;er("");
 if(u.ph!==pwHash(cur))return er("Senha atual incorreta.");
 if(n1.length<6)return er("A nova senha deve ter ao menos 6 caracteres.");
 if(n1===cur)return er("A nova senha deve ser diferente da atual.");
 if(n1!==n2)return er("A confirmação não confere com a nova senha.");
 state.user={...u,ph:pwHash(n1),pv:2};persistUser();toast("Senha alterada");settings()}
const LOYAL=[["shield","Profissionais credenciados","Equipe técnica preparada para cuidar da sua casa."],["clock","Agendamento em poucos passos","Escolha o serviço, o dia e o horário e acompanhe tudo pelo app."],["home","Seu histórico sempre à mão","Repita um serviço ou peça um novo quando precisar."]];
const COVER_SVC=[["bolt","Elétrica"],["drop","Hidráulica"],["cam","CFTV"],["brick","Construção civil"],["chair","Móveis"],["roof","Calhas"],["shield","Segurança eletrônica"],["wifi","Telecom"]];
function enter(){if(state.user){state.tab="inicio";go("home")}else go("welcome")}
function cover(){const u=state.user,n=state.appointments.filter(a=>a.status!=="Cancelado").length,first=u&&u.name?u.name.trim().split(/\s+/)[0]:"";
 const t=u?"Que bom ter você de volta"+(first?", "+esc(first):"")+"!":"Seja bem-vindo à PRO Service";
 const sub=u?(n?`Você já fez ${n} ${n>1?"solicitações":"solicitação"} com a gente. Obrigado pela confiança!`:"Sua casa continua em boas mãos."):"Quem é cliente PRO conta com a gente sempre que a casa pedir.";
 app.innerHTML=`<div class="cover"><div class="cv-band"><h1>${t}</h1><p>${sub}</p></div><div class="cv-logo"><img src="${LOGO}" alt="PRO Service - Serviços e Soluções Residenciais"></div><p class="cv-slogan">Sua casa em boas mãos!</p><ul class="cv-loyal">${LOYAL.map(l=>`<li><span class="b">${I(l[0],20).replace('class="i"','class="i" style="color:#fff"')}</span><span><b>${l[1]}</b><small>${l[2]}</small></span></li>`).join("")}</ul><div class="cv-svc-t">Tudo para a sua casa, em um só lugar</div><ul class="cv-svc">${COVER_SVC.map(c=>`<li><span class="c">${I(c[0],22)}</span>${c[1]}</li>`).join("")}</ul><div class="cv-cta"><button class="primary" onclick="enter()">${u?"Continuar":"Começar"}</button>${u?"":`<button class="cv-link" onclick="go('login')">Já tenho conta</button>`}</div></div>`}
function render(){const m={cover,welcome,login:()=>auth(false),register:()=>auth(true),home,services:servicesPage,photos:photosPage,professionals:prosPage,schedule:schedulePage,confirm:confirmPage,success,appointments,detail,profile,edit,settings};(m[state.page]||welcome)()}
state.page="cover";render();
addEventListener("pageshow",e=>{if(e.persisted){state.user=null;state.page="cover";render()}});
</script>
<style>
#pwa-bn{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:2147483500;display:none;align-items:center;gap:10px;background:#023072;color:#fff;border-radius:16px;padding:10px 10px 10px 14px;box-shadow:0 8px 28px #0000004d;font-family:'Plus Jakarta Sans',Inter,'Segoe UI',Arial,sans-serif;max-width:460px;margin:0 auto}
#pwa-bn.on{display:flex}
#pwa-bn span{flex:1;font-size:13px;font-weight:600;line-height:1.3}
#pwa-bn button{border:0;cursor:pointer;font-family:inherit}
#pwa-bn .go{background:#fd6106;color:#fff;font-weight:700;font-size:13px;border-radius:10px;padding:10px 14px}
#pwa-bn .x{background:none;color:#ffffffb0;font-size:20px;padding:4px 8px;line-height:1}
#pwa-ov{position:fixed;inset:0;background:rgba(16,39,80,.5);z-index:2147483600;display:none;align-items:flex-end;justify-content:center}
#pwa-ov.on{display:flex}
#pwa-sh{width:min(440px,100%);background:#fff;border-radius:20px 20px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px #00000030;text-align:center}
#pwa-sh img{width:64px;height:64px;border-radius:14px;object-fit:contain}
#pwa-sh h2{margin:10px 0 4px;font-size:18px;color:#023072}
#pwa-sh p{margin:0 0 14px;color:#6b778c;font-size:13px;line-height:1.5}
#pwa-sh ol{text-align:left;margin:0 0 14px;padding-left:20px;color:#102750;font-size:13px;line-height:1.7}
#pwa-sh .pbtn{width:100%;border:0;font-size:14px;cursor:pointer;border-radius:12px;padding:15px 16px;background:#fd6106;color:#fff;font-weight:700;box-shadow:0 6px 16px #fd61062e}
#pwa-sh .pno{display:block;border:0;background:none;cursor:pointer;margin:12px auto 0;color:#6b778c;font-size:13px;font-weight:600}
</style>
<script>
(function(){
  if('serviceWorker' in navigator){
    addEventListener('load',function(){
      navigator.serviceWorker.register('sw-cliente.js',{scope:location.pathname}).catch(function(){});
    });
  }
  var ua=navigator.userAgent||'';
  var standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
  var ios=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  var android=/Android/i.test(ua);
  var inApp=/; wv\)|FBAN|FBAV|Instagram|GSA\/|Line\/|WhatsApp|Telegram/i.test(ua);
  var deferred=null, shown=false, KEY='proInstDismiss';

  function dismissed(){try{var t=+localStorage.getItem(KEY)||0;return Date.now()-t<3*24*3600*1000}catch(e){return false}}
  function remember(){try{localStorage.setItem(KEY,String(Date.now()))}catch(e){}}

  var ov=document.createElement('div');ov.id='pwa-ov';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');
  ov.innerHTML='<div id="pwa-sh"></div>';
  document.addEventListener('DOMContentLoaded',function(){document.body.appendChild(ov)});
  if(document.body)document.body.appendChild(ov);
  ov.addEventListener('click',function(e){if(e.target===ov)closeSheet(true)});
  // Banner fixo "Instalar app" (aparece em qualquer tela, inclusive no login)
  var bn=document.createElement('div');bn.id='pwa-bn';
  bn.innerHTML='<span>Instale o app no seu celular</span><button class="go" onclick="proInstall()">Instalar</button><button class="x" aria-label="Fechar" onclick="proBannerClose()">&times;</button>';
  function mountBn(){if(!bn.parentNode)document.body.appendChild(bn);if(!standalone&&!bannerClosed())bn.classList.add('on')}
  function bannerClosed(){try{return sessionStorage.getItem('proBn')==='1'}catch(e){return false}}
  window.proBannerClose=function(){bn.classList.remove('on');try{sessionStorage.setItem('proBn','1')}catch(e){}};
  if(document.body)mountBn();else document.addEventListener('DOMContentLoaded',mountBn);


  function chromeIntent(){
    return 'intent://'+location.host+location.pathname+'#Intent;scheme=https;package=com.android.chrome;end';
  }
  function draw(){
    var sh=document.getElementById('pwa-sh');if(!sh)return;
    var h='<img src="icon-cliente-192.png?v=2" alt=""><h2>Instale o app PRO Service</h2>';
    if(deferred){
      h+='<p>Tenha o app na tela inicial do seu aparelho e agende serviços com um toque.</p><button class="pbtn" onclick="proDoInstall()">Instalar aplicativo</button>';
    }else if(ios){
      h+='<p>No iPhone a instalação é feita pelo Safari:</p><ol><li>Toque no botão <b>Compartilhar</b> (quadrado com seta para cima)</li><li>Escolha <b>Adicionar à Tela de Início</b></li><li>Toque em <b>Adicionar</b></li></ol>';
    }else if(android&&inApp){
      h+='<p>Para instalar, abra este link no <b>Chrome</b>.</p><button class="pbtn" onclick="location.href=\''+chromeIntent()+'\'">Abrir no Chrome</button>';
    }else if(android){
      h+='<p>No menu do navegador (<b>⋮</b> ou <b>≡</b>) escolha <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>. Se a opção não aparecer, abra este link no <b>Chrome</b>.</p><button class="pbtn" onclick="location.href=\''+chromeIntent()+'\'">Abrir no Chrome</button>';
    }else{
      h+='<p>No computador, clique no ícone de instalar na barra de endereço do navegador (Chrome ou Edge).</p>';
    }
    h+='<button class="pno" onclick="proSheetClose()">'+(deferred?'Agora não':'Fechar')+'</button>';
    sh.innerHTML=h;
  }
  function openSheet(){draw();ov.classList.add('on');shown=true}
  function closeSheet(remind){ov.classList.remove('on');if(remind)remember()}

  window.proSheetClose=function(){closeSheet(true)};
  window.proDoInstall=function(){
    if(!deferred)return;
    var d=deferred;deferred=null;closeSheet(false);
    d.prompt();
    if(d.userChoice)d.userChoice.then(function(c){if(c&&c.outcome!=='accepted')remember()});
  };
  window.proInstall=function(){
    if(deferred){window.proDoInstall();return}
    openSheet();
  };

  function auto(){
    if(standalone||shown||dismissed())return;
    if(deferred||ios||android)openSheet();
  }
  addEventListener('beforeinstallprompt',function(e){
    e.preventDefault();deferred=e;
    if(ov.classList.contains('on'))draw();else if(timerDone)auto();
  });
  addEventListener('appinstalled',function(){
    deferred=null;closeSheet(false);remember();bn.classList.remove('on');
    var t=document.getElementById('toast');if(t){t.textContent='App instalado!';t.style.display='block';setTimeout(function(){t.style.display='none'},2500)}
  });
  var timerDone=false;
  setTimeout(function(){timerDone=true;auto()},1200);

  // Botão "Instalar aplicativo" também na aba Perfil
  if(typeof window.profile==='function'&&!standalone){
    var orig=window.profile;
    window.profile=function(){
      orig.apply(this,arguments);
      var m=document.querySelector('#app main');
      if(m&&!document.getElementById('pwa-card')){
        var c=document.createElement('div');c.className='card';c.id='pwa-card';
        c.innerHTML='<b>Instalar aplicativo</b><p class="muted" style="margin:4px 0 0">Tenha o PRO Service na tela inicial do aparelho.</p><button class="secondary" onclick="proInstall()">Instalar aplicativo</button>';
        m.appendChild(c);
      }
    };
  }
})();
</script>
</body></html>
