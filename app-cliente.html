<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>PRO Service – Agendar</title>
<meta name="theme-color" content="#003070">
<link rel="manifest" href="manifest-cliente.json">
<link rel="icon" type="image/png" href="icon-cliente-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon-cliente.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PRO Service">
<style>
:root {
  --primary: #003070;
  --primary-dark: #00214F;
  --primary-light: #E6EDF7;
  --accent: #003070;
  --orange: #FC6104;
  --cta: #E55A00;
  --green: #2E7D32;
  --green-light: #E8F5E9;
  --red: #C62828;
  --bg: #F4F6F9;
  --card: #FFFFFF;
  --border: #E0E0E0;
  --text: #1a1a1a;
  --text2: #616161;
  --text3: #9E9E9E;
  --zap: #25D366;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── HEADER ── */
#header{background:#fff;border-bottom:2px solid var(--border);padding:0 16px;position:sticky;top:0;z-index:30}
.header-inner{max-width:540px;margin:0 auto;position:relative}
.header-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:10px 0 8px}
.brand-logo{width:120px;height:72px;border-radius:0;background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.brand-name{font-weight:700;font-size:15px;flex:1}
.user-chip{width:30px;height:30px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;cursor:pointer;border:2px solid var(--primary);flex-shrink:0;position:absolute;top:10px;right:0;z-index:1}

/* NAV ITEMS NO TOPO (Agendar / Fotos) */
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 8px;cursor:pointer;color:var(--text3);font-size:11px;font-weight:600;user-select:none;transition:color .15s;max-width:90px}
.bn-item svg{width:22px;height:22px;fill:currentColor}
.bn-item.active{color:var(--primary);border-bottom:2px solid var(--orange)}

/* STEPPER BARRA */
.stepper{display:flex;gap:4px;padding-bottom:0;position:relative}
.step-seg{height:3px;flex:1;background:var(--border);border-radius:3px;overflow:hidden;transition:background .3s}
.step-seg.done{background:var(--orange)}
.step-seg.active{background:var(--orange)}
.step-seg.half{background:linear-gradient(to right,var(--orange) 60%,var(--border) 60%)}

/* ── BODY ── */
#app{max-width:540px;margin:0 auto;padding:20px 16px 40px}
body{padding-bottom:0}

/* BACK LINK */
.back-link{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;color:var(--text2);cursor:pointer;margin-bottom:16px;user-select:none;font-weight:500}
.back-link:hover{color:var(--primary)}
.back-link svg{width:16px;height:16px;fill:currentColor}

/* TÍTULOS */
.step-title{font-size:20px;font-weight:700;margin-bottom:3px;color:var(--text)}
.step-sub{font-size:13px;color:var(--text2);margin-bottom:20px}
.step-sub b{color:var(--accent)}
.step-sub a{color:var(--primary)}

/* ── CARDS DE SERVIÇO ── */
.srv-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:border-color .15s,box-shadow .15s;position:relative}
.srv-card:hover{border-color:var(--primary);box-shadow:0 2px 12px rgba(0,48,112,.12)}
.srv-img{width:46px;height:46px;border-radius:10px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden}
.srv-img img{width:100%;height:100%;object-fit:cover}
.srv-body{flex:1;min-width:0}
.srv-name{font-size:14.5px;font-weight:700;color:var(--text)}
.srv-desc{font-size:12px;color:var(--accent);margin-top:2px}
.srv-meta{font-size:13px;color:var(--primary);font-weight:600;margin-top:4px;display:flex;align-items:center;gap:8px}
.srv-meta .dur{color:var(--text3);font-weight:400;font-size:12px;display:flex;align-items:center;gap:3px}
.srv-meta .dur svg{width:12px;height:12px;fill:var(--text3)}

/* ── CALENDÁRIO MENSAL ── */
.cal-wrap{background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:10px}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-month{font-size:16px;font-weight:700;text-transform:capitalize}
.cal-nav{width:32px;height:32px;border:none;background:none;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:background .15s}
.cal-nav:hover{background:var(--bg)}
.cal-nav svg{width:18px;height:18px;fill:currentColor}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{text-align:center;font-size:11px;font-weight:600;color:var(--text3);padding:4px 0;text-transform:capitalize}
.cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:13px;cursor:default;color:var(--text3);transition:all .15s;font-weight:500;border:none;background:none}
.cal-cell.avail{color:var(--text);cursor:pointer;font-weight:600}
.cal-cell.avail:hover{background:var(--primary-light);color:var(--primary)}
.cal-cell.today{color:var(--primary);font-weight:700}
.cal-cell.selected{background:var(--primary);color:#fff !important;font-weight:700}
.cal-cell.past{color:#ccc;pointer-events:none}
.cal-cell.other-month{opacity:0}

/* ── LISTA DE HORÁRIOS ── */
.time-list{display:flex;flex-direction:column;gap:8px}
.time-item{background:#fff;border:1px solid var(--border);border-radius:10px;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:border-color .15s,background .15s}
.time-item:hover{border-color:var(--primary);background:var(--primary-light)}
.time-item-left{display:flex;align-items:center;gap:10px}
.time-item-left svg{width:16px;height:16px;fill:var(--text3);flex-shrink:0}
.time-hour{font-size:14.5px;font-weight:700;color:var(--text)}
.time-prof{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text2)}
.time-prof svg{width:14px;height:14px;fill:var(--text3)}

/* ── RESUMO / CARRINHO ── */
.resumo-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;position:relative}
.resumo-card-header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.resumo-img{width:40px;height:40px;border-radius:8px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;overflow:hidden}
.resumo-img img{width:100%;height:100%;object-fit:cover}
.resumo-name{font-size:14px;font-weight:700}
.resumo-info{font-size:12px;color:var(--text2);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.resumo-info span{display:flex;align-items:center;gap:3px}
.resumo-info svg{width:12px;height:12px;fill:var(--text3)}
.resumo-preco{font-size:14px;font-weight:700;color:var(--primary);margin-top:6px}
.resumo-remove{position:absolute;top:14px;right:14px;width:24px;height:24px;border:1px solid var(--border);background:#fff;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text3);transition:all .15s}
.resumo-remove:hover{background:var(--red);color:#fff;border-color:var(--red)}
.total-row{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:15px;font-weight:700}
.total-row span:last-child{color:var(--primary)}
.add-srv-btn{border:2px dashed var(--primary);background:transparent;color:var(--primary);border-radius:10px;padding:13px;width:100%;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:10px;transition:background .15s}
.add-srv-btn:hover{background:var(--primary-light)}

/* ── CONFIRMAÇÃO ── */
.confirm-card{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:20px}
.confirm-row{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--border)}
.confirm-row:last-child{border-bottom:none}
.confirm-label{font-size:13.5px;color:var(--primary);font-weight:500}
.confirm-val{font-size:13.5px;color:var(--text);font-weight:600;text-align:right}
.confirm-val.price{color:var(--primary);font-size:15px;font-weight:700}

/* ── BOTÕES ── */
.btn{width:100%;padding:15px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .15s,transform .1s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--cta);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-zap{background:var(--zap);color:#fff}
.btn-ghost{background:#fff;color:var(--text2);border:1.5px solid var(--border)}
.btn-ghost:hover{background:var(--bg)}
.btn-sm{padding:10px 14px;font-size:13px;border-radius:8px;width:auto}

/* ── SUCCESS ── */
.success-wrap{text-align:center;padding:30px 0 20px}
.success-icon{width:76px;height:76px;border-radius:50%;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:38px;margin:0 auto 18px}
.success-title{font-size:22px;font-weight:700;margin-bottom:8px}
.success-sub{font-size:13.5px;color:var(--text2);margin-bottom:24px;line-height:1.6}

/* ── FORM ── */
.form-group{margin-bottom:16px}
.form-label{font-size:13px;font-weight:600;margin-bottom:6px;display:block}
.form-input{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;font-family:inherit;color:var(--text);outline:none;transition:border .15s;background:#fff}
.form-input:focus{border-color:var(--primary)}
.phone-row{display:flex;gap:8px}
.phone-prefix{display:flex;align-items:center;gap:5px;padding:0 14px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-weight:600;color:var(--text2);background:#fafafa;flex-shrink:0;white-space:nowrap}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;padding:0;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:540px;padding:24px 22px 36px;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 20px}
.modal-title{font-size:18px;font-weight:700;margin-bottom:6px}
.modal-sub{font-size:13px;color:var(--text2);margin-bottom:20px;line-height:1.5}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);background:#222;color:#fff;padding:12px 22px;border-radius:10px;font-size:13.5px;font-weight:500;z-index:300;opacity:0;transition:all .25s;pointer-events:none;max-width:90%;text-align:center;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* EMPTY */
.empty{text-align:center;padding:50px 16px;color:var(--text3)}
.empty .eicon{font-size:44px;margin-bottom:14px}
.empty p{font-size:15px;font-weight:600;color:var(--text2);margin-bottom:4px}
.empty span{font-size:13px}

/* HINT */
.hint{font-size:12px;color:var(--text3);text-align:center;margin-top:10px;line-height:1.5}

/* ── BOTTOM NAV (Agendar / Fotos) ── */
/* ── BOTTOM NAV (removida: itens movidos para o topo do header) ── */
/* .bn-item styles now defined in HEADER section above */

/* ── FOTOS TAB ── */
#app-fotos{max-width:540px;margin:0 auto;padding:20px 16px 110px;display:none}
.foto-tipo-toggle{display:flex;gap:8px;margin-bottom:16px}
.foto-tipo-btn{flex:1;padding:11px;border:1.5px solid var(--border);border-radius:10px;background:#fff;font-size:13.5px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s;text-align:center}
.foto-tipo-btn.active{border-color:var(--primary);background:var(--primary-light);color:var(--primary)}
.foto-upload-box{border:2px dashed var(--border);border-radius:14px;padding:28px 16px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;margin-bottom:16px;background:#fff}
.foto-upload-box:hover{border-color:var(--primary);background:var(--primary-light)}
.foto-upload-box .ficon{font-size:32px;margin-bottom:8px}
.foto-upload-box p{font-size:13.5px;font-weight:600;color:var(--text)}
.foto-upload-box span{font-size:12px;color:var(--text3)}
.foto-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.foto-item{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bg);border:1px solid var(--border)}
.foto-item img{width:100%;height:100%;object-fit:cover;display:block}
.foto-badge{position:absolute;top:5px;left:5px;font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:20px;color:#fff;text-transform:uppercase;letter-spacing:.3px}
.foto-badge.antes{background:#78909C}
.foto-badge.depois{background:var(--green)}
.foto-item .fstatus{position:absolute;bottom:5px;right:5px;font-size:13px}
.foto-uploading{position:relative;aspect-ratio:1;border-radius:10px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--primary);font-weight:600;text-align:center;padding:4px}
.foto-section-title{font-size:13px;font-weight:700;color:var(--text2);margin:22px 0 10px;text-transform:uppercase;letter-spacing:.4px}

@media(min-width:540px){
  .modal-overlay{align-items:center;padding:20px}
  .modal{border-radius:16px;max-height:90vh;overflow-y:auto}
  .modal-overlay.open .modal{transform:translateY(0)}
}
</style>
</head>

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function toLocalISODate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const dia = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dia}`;
}
function brl(v) { return 'R$ ' + (+v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}
function fmtDate(d) {
  if (!d) return '–';
  const dt = new Date(d + 'T00:00:00');

}
function fmtDateShort(d) {
  if (!d) return '–';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric'});

function escolherServico(id) {

// ─── ETAPA 2: CALENDÁRIO ──────────────────────────────────────────
function renderData(app) {
  const agoraNota = new Date();
  const fechadoHoje = agoraNota.getHours() >= 17;
  app.innerHTML = `
    <div class="back-link" onclick="ir('servico')">${SVG_BACK} Voltar</div>
    <div class="step-title">Escolha a data</div>
    <div class="step-sub">Apenas datas com <b>disponibilidade</b> estão habilitadas.${fechadoHoje ? ' Agendamentos para hoje encerram às 17:00 — próximo horário disponível é amanhã.' : ''}</div>
    <div id="cal-container"></div>`;
  renderCal();
}

function renderCal() {
  const container = document.getElementById('cal-container');
  if (!container) return;

  const horarios = state.config.horarios || DIAS.map((d,i) => ({dia:d, ativo:i>=1&&i<=6, inicio:'08:00', fim:'18:00'}));
  const hoje = new Date();
  hoje.setHours(0,0,0,0);
  const maxData = new Date(hoje); maxData.setDate(hoje.getDate()+90);

  // ── Corte de horário: após as 17:00, o dia de hoje deixa de aceitar agendamento ──
  const HORA_CORTE = 17;
  const agoraCorte = new Date();
  const hojeFechadoParaAgendamento = agoraCorte.getHours() >= HORA_CORTE;

  const primeiroDia = new Date(calAno, calMes, 1);
  const ultimoDia   = new Date(calAno, calMes+1, 0);
  const dowInicio   = primeiroDia.getDay(); // 0=dom

  // mês anterior/próximo possível?
  const podePrev = new Date(calAno, calMes, 1) > hoje;
  const podeNext = new Date(calAno, calMes+1, 1) <= maxData;

  // dias da semana header
  const dowHeader = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(d => `<div class="cal-dow">${d}</div>`).join('');

  // offset: domingo=0, mas grid começa na segunda
  const offset = (dowInicio + 6) % 7; // segunda=0

  let cells = '';
  // células vazias antes
  for (let i = 0; i < offset; i++) cells += `<div class="cal-cell other-month"></div>`;

  for (let dia = 1; dia <= ultimoDia.getDate(); dia++) {
    const d = new Date(calAno, calMes, dia);
    d.setHours(0,0,0,0);
    const dow = d.getDay();
    const ds  = toLocalISODate(d);
    const h   = horarios[dow];
    const passado = d < hoje || (d.getTime() === hoje.getTime() && hojeFechadoParaAgendamento);
    const foraDoLimite = d > maxData;
    const disponivel = h && h.ativo && !passado && !foraDoLimite;
    const isHoje = d.getTime() === hoje.getTime();

    let cls = 'cal-cell';
    if (!disponivel) cls += ' past';
    else { cls += ' avail'; if (isHoje) cls += ' today'; }

    const onclick = disponivel ? `onclick="escolherData('${ds}','${h.inicio}','${h.fim}')"` : '';
    cells += `<div class="${cls}" ${onclick}>${dia}</div>`;
  }

  // células depois
  const totalCells = offset + ultimoDia.getDate();
  const resto = totalCells % 7;
  if (resto > 0) for (let i = 0; i < 7-resto; i++) cells += `<div class="cal-cell other-month"></div>`;

  container.innerHTML = `
    <div class="cal-wrap">
      <div class="cal-header">
        <button class="cal-nav" onclick="navCal(-1)" ${!podePrev?'disabled style="opacity:.3;cursor:not-allowed"':''}>${SVG_NAV_PREV}</button>
        <div class="cal-month">${MESES[calMes]} ${calAno}</div>
        <button class="cal-nav" onclick="navCal(1)" ${!podeNext?'disabled style="opacity:.3;cursor:not-allowed"':''}>${SVG_NAV_NEXT}</button>
      </div>
      <div class="cal-grid">
        ${dowHeader}
        ${cells}
      </div>
    </div>`;
}

function navCal(dir) {
  calMes += dir;
  if (calMes > 11) { calMes = 0; calAno++; }
  if (calMes < 0)  { calMes = 11; calAno--; }
  renderCal();
}

function escolherData(ds, hrI, hrF) {

// ─── ETAPA 3: HORÁRIOS ────────────────────────────────────────────
function renderHora(app) {
  const srv = state.servicos.find(s => s.id === itemAtual.servicoId);
  const duracao = srv ? (srv.duracao||60) : 60;
  const inicio  = itemAtual.hrInicio || '08:00';
  const fim     = itemAtual.hrFim    || '18:00';

  // profissionais ativos
  const profsAtivos = (state.profissionais||[]).filter(p => p.ativo);

  // agendamentos já existentes nesta data (usados para checar ocupação por profissional)
  const agendamentosData = (state.agendamentos||[]).filter(a => a.data === itemAtual.data);

  // solicitações pendentes nesta data (ainda não confirmadas, mas já "reservam" o horário
  // para não deixar dois clientes marcarem o mesmo horário antes da confirmação)
  const solicitacoesData = (state.solicitacoes||[]).filter(
    s => s.data === itemAtual.data && s.status !== 'cancelado'
  );

  let slots = [];
  let [h, m] = inicio.split(':').map(Number);
  const [hf, mf] = fim.split(':').map(Number);
  const agora = new Date();
  const dataHoje = toLocalISODate(agora);
  const ehHoje = itemAtual.data === dataHoje;

  while (h*60+m <= hf*60+mf) {
    const slot = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
    if (ehHoje) {
      const minutosSlot = h * 60 + m;
      const minutosAgora = agora.getHours() * 60 + agora.getMinutes() + 30;
      if (minutosSlot <= minutosAgora) {
        m += 30; if (m >= 60) { m -= 60; h++; }
        continue;
      }
    }
    if (profsAtivos.length) {
      // procura o primeiro profissional ativo que esteja livre neste horário
      // (considera tanto agendamentos confirmados quanto solicitações ainda pendentes)
      const profDisponivel = profsAtivos.find(p =>
        !agendamentosData.some(a => a.hora === slot && a.profissional === p.nome) &&
        !solicitacoesData.some(s => s.hora === slot && s.profissional === p.nome)
      );
      if (profDisponivel) slots.push({ hora: slot, profissional: profDisponivel.nome });
      // se nenhum profissional estiver livre, o horário fica de fora (totalmente ocupado)
    } else {
      // sem profissionais cadastrados: verifica ocupação pelo horário
      // (considera tanto agendamentos confirmados quanto solicitações pendentes)
      const ocupado = agendamentosData.some(a => a.hora === slot) ||
                      solicitacoesData.some(s => s.hora === slot);
      if (!ocupado) slots.push({ hora: slot, profissional: '' });
    }
    m += 30; if (m >= 60) { m -= 60; h++; }
  }

  // linha de info
  const dt = new Date(itemAtual.data + 'T00:00:00');
  const dataInfo = `${fmtDateShort(itemAtual.data)} – ${itemAtual.servico}`;

  app.innerHTML = `
    <div class="back-link" onclick="ir('data')">${SVG_BACK} Voltar</div>
    <div class="step-title">Escolha o horário</div>
    <div class="step-sub" style="color:var(--accent)">${dataInfo}</div>
    ${slots.length === 0
      ? `<div class="empty"><div class="eicon">🕐</div><p>Sem horários disponíveis</p><span>Escolha outra data.</span></div>`
      : `<div class="time-list">
          ${slots.map(s => {
            const prof = s.profissional;
            return `<div class="time-item" onclick="escolherHora('${s.hora}','${escapeHtml(prof)}')">
              <div class="time-item-left">
                ${SVG_CLK}
                <span class="time-hour">${s.hora}</span>
              </div>
              ${prof ? `<div class="time-prof">${SVG_USER} ${escapeHtml(prof)}</div>` : ''}
            </div>`;
          }).join('')}
        </div>`
    }`;
}

function escolherHora(hora, prof) {
  itemAtual.hora = hora;
  itemAtual.profissional = prof;
  // Adiciona ao carrinho
  carrinho.push({...itemAtual});

// ═══════════════════════════════════════════════════════════════════
// ABA FOTOS (ANTES / DEPOIS)
// ═══════════════════════════════════════════════════════════════════
let abaAtual = 'agendamento';
let tipoFotoSelecionado = 'antes';
let enviandoFotos = 0; // contador de uploads em andamento (mostra placeholders)

function mudarAba(aba) {
  if (aba === abaAtual) return;
  if (aba === 'fotos') {
    exigirLogin(async () => {
      abaAtual = 'fotos';
      aplicarAba();
      await carregarFotos();
      renderFotos();
    });
    return;
  }
  abaAtual = aba;
  aplicarAba();
}

function aplicarAba() {
  document.getElementById('app').style.display = abaAtual === 'agendamento' ? 'block' : 'none';
  document.getElementById('app-fotos').style.display = abaAtual === 'fotos' ? 'block' : 'none';
  document.getElementById('bn-agendar').classList.toggle('active', abaAtual === 'agendamento');
  document.getElementById('bn-fotos').classList.toggle('active', abaAtual === 'fotos');
  if (abaAtual === 'agendamento') render();
}

function renderFotos() {
  const container = document.getElementById('app-fotos');
  if (!container) return;

  const antes  = state.fotos.filter(f => f.tipo === 'antes');
  const depois = state.fotos.filter(f => f.tipo === 'depois');

  const grid = (lista, tipo) => `
    <div class="foto-grid">
      ${lista.map(f => `
        <div class="foto-item">
          <img src="${f.url}" loading="lazy">
          <div class="foto-badge ${tipo}">${tipo}</div>
          <div class="fstatus">${f.status === 'aprovado' ? '✅' : '🕓'}</div>
          <button type="button" class="foto-del-btn" title="Excluir foto"
            onclick="excluirFotoCliente('${f.id}')"
            style="position:absolute;top:6px;right:6px;width:26px;height:26px;border:none;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:14px;line-height:26px;text-align:center;cursor:pointer;padding:0">🗑️</button>
        </div>`).join('')}
    </div>`;

  container.innerHTML = `
    <div class="step-title">Fotos antes/depois</div>
    <div class="step-sub">Envie fotos do local para o prestador acompanhar o serviço.</div>

    <div class="foto-tipo-toggle">
      <div class="foto-tipo-btn ${tipoFotoSelecionado==='antes'?'active':''}" onclick="selecionarTipoFoto('antes')">📷 Antes</div>
      <div class="foto-tipo-btn ${tipoFotoSelecionado==='depois'?'active':''}" onclick="selecionarTipoFoto('depois')">✨ Depois</div>
    </div>

    <div class="foto-upload-box" onclick="document.getElementById('foto-input').click()">
      <div class="ficon">📤</div>
      <p>Toque para enviar foto${tipoFotoSelecionado==='antes'?'s do "antes"':'s do "depois"'}</p>
      <span>JPG ou PNG · você pode selecionar várias</span>
    </div>

    ${(antes.length || depois.length || enviandoFotos)
      ? `
        <div class="foto-section-title">Antes (${antes.length})</div>
        ${antes.length ? grid(antes,'antes') : `<p class="hint" style="text-align:left">Nenhuma foto de "antes" enviada ainda.</p>`}
        <div class="foto-section-title">Depois (${depois.length})</div>
        ${depois.length ? grid(depois,'depois') : `<p class="hint" style="text-align:left">Nenhuma foto de "depois" enviada ainda.</p>`}
      `
      : `<div class="empty"><div class="eicon">🖼️</div><p>Nenhuma foto enviada</p><span>Envie fotos de antes e depois do serviço.</span></div>`
    }`;
}

function selecionarTipoFoto(tipo) {
  tipoFotoSelecionado = tipo;
  renderFotos();
}

async function excluirFotoCliente(id) {
  const f = state.fotos.find(x => x.id === id);
  if (!f) return;
  if (!confirm('Excluir esta foto? Essa ação não pode ser desfeita.')) return;

  try {
    // Remove o arquivo do Storage (se conseguirmos extrair o caminho da URL pública)
    const marcador = '/fotos-clientes/';
    const idx = (f.url || '').indexOf(marcador);
    if (idx >= 0) {
      const caminho = f.url.slice(idx + marcador.length);
      await sb.storage.from('fotos-clientes').remove([caminho]);
    }
    // Remove o registro da tabela
    await sb.from('fotos_clientes').delete().eq('id', id);
  } catch(e) {
    console.error('Erro ao excluir foto:', e);
    toast('Não foi possível excluir a foto.');
    return;
  }

  state.fotos = state.fotos.filter(x => x.id !== id);
  renderFotos();
  toast('🗑️ Foto excluída.');
}

async function onFotoInputChange(event) {
  const arquivos = Array.from(event.target.files || []);
  event.target.value = ''; // permite selecionar o mesmo arquivo de novo depois
  if (!arquivos.length) return;
  if (!session.nome || !session.zap) { toast('Faça login para enviar fotos.'); return; }

  const zapNum = numZap(session.zap);
  enviandoFotos += arquivos.length;
  renderFotos();

  for (const arquivo of arquivos) {
    try {
      const nomeArq = arquivo.name || '';
      const temExtensao = nomeArq.lastIndexOf('.') > 0;
      const ext = (temExtensao ? nomeArq.split('.').pop() : 'jpg').toLowerCase();
      const caminho = `${zapNum}/${uid()}.${ext}`;

      const { error: erroUpload } = await sb.storage
        .from('fotos-clientes')
        .upload(caminho, arquivo, { cacheControl: '3600', upsert: false });
      if (erroUpload) throw erroUpload;

      const { data: pub } = sb.storage.from('fotos-clientes').getPublicUrl(caminho);

      const foto = {
        id: uid(), ts: Date.now(), cliente: session.nome, zap: zapNum,
        tipo: tipoFotoSelecionado, legenda: '', url: pub.publicUrl,
        status: 'novo', origem: 'app-cliente',
      };
      await gravarFoto(foto);
      state.fotos.unshift(foto);
    } catch(e) {
      console.error('Erro ao enviar foto:', e);
      toast('Não foi possível enviar uma das fotos.');
    } finally {
      enviandoFotos = Math.max(0, enviandoFotos - 1);
      renderFotos();
    }
  }
  toast('Foto(s) enviada(s) ✅');
}

// ═══════════════════════════════════════════════════════════════════
// AÇÕES
// ═══════════════════════════════════════════════════════════════════
let enviandoAgendamento = false;
async function confirmarAgendamento() {
  if (enviandoAgendamento) return;
  enviandoAgendamento = true;
  const btn = document.getElementById('btn-confirmar-agendamento');
  if (btn) { btn.disabled = true; btn.style.opacity = '.6'; btn.textContent = 'Enviando...'; }

  const agora = Date.now();
  const novasSolicitacoes = [];
  carrinho.forEach((item, idx) => {
    const sol = {
      id: uid(),
      ts: agora + idx,
      cliente: session.nome,
      zap: numZap(session.zap),
      servico: item.servico,
      icone: item.icone,
      data: item.data,
      hora: item.hora,
      profissional: item.profissional || '',
      obs: '',
      valor: item.valor || 0,
      status: 'pendente',
      origem: 'app-cliente',
    };
    novasSolicitacoes.push(sol);
    if (!state.solicitacoes) state.solicitacoes = [];
    state.solicitacoes.push(sol);
  });

  // Registra cliente se novo
  if (!state.clientes) state.clientes = [];
  const zapNum = numZap(session.zap);
  const clienteNovo = { id: uid(), nome: session.nome, zap: zapNum, end:'', pedidos:0, gasto:0 };
  if (!state.clientes.find(c => c.zap === zapNum)) {
    state.clientes.push(clienteNovo);
  }

  // Grava de verdade no Supabase
  try {
    for (const sol of novasSolicitacoes) await gravarSolicitacao(sol);
    await gravarClienteSeNovo(clienteNovo);
  } catch(e) {
    console.error('Erro ao gravar agendamento:', e);
    toast('Não foi possível enviar. Verifique sua conexão e tente de novo.');
    enviandoAgendamento = false;
    if (btn) { btn.disabled = false; btn.style.opacity = ''; btn.textContent = 'Confirmar Agendamento'; }
    return;
  }

  // Não abre mais o WhatsApp automaticamente — a solicitação já foi
  // gravada direto no dashboard. O cliente pode falar no WhatsApp
  // manualmente pelo botão "Falar agora no WhatsApp" na tela de sucesso.

  enviandoAgendamento = false;

  carrinhoFinalizado = [...carrinho];
  ir('sucesso');
}

function abrirZap() {
  if (!state.config.zap) { toast('Prestador não configurou WhatsApp ainda.'); return; }
  const itens = carrinhoFinalizado.length ? carrinhoFinalizado : carrinho;
  const msg = `Olá! Acabei de agendar pelo link 📅\n\n*Cliente:* ${session.nome}\n*Serviço:* ${itens.map(i=>i.servico).join(', ')}\n*Data:* ${itens.map(i=>fmtDateShort(i.data)).join(', ')}\n*Horário:* ${itens.map(i=>i.hora).join(', ')}`;
  window.open(zapLink(state.config.zap, msg), '_blank');
}

// LOGIN
// ═══════════════════════════════════════════════════════════════════
function exigirLogin(cb) {
  if (session.nome && session.zap) { cb(); return; }
  loginCb = cb;
  document.getElementById('login-nome').value = session.nome || '';
  document.getElementById('login-zap').value  = session.zap  || '';
  document.getElementById('modal-login').classList.add('open');
}

function fazerLogin() {
  const nome = document.getElementById('login-nome').value.trim();
  const zap  = document.getElementById('login-zap').value.trim();
  const digits = numZap(zap);
  if (!nome) { toast('Informe seu nome'); return; }
  if (digits.length < 10) { toast('WhatsApp inválido – informe com DDD'); return; }
  session.nome = nome;
  session.zap  = zap;
  salvarSessao();
  fecharModal('modal-login');
  atualizarHeader();
  toast('Olá, ' + nome + '! 👋');
  if (loginCb) { const cb = loginCb; loginCb = null; cb(); }
}

function abrirPerfil() {
  if (!confirm(`Sair da conta de ${session.nome}?`)) return;
  session = { nome:'', zap:'' };
  salvarSessao();
  atualizarHeader();
  state.fotos = [];
  if (abaAtual === 'fotos') { abaAtual = 'agendamento'; aplicarAba(); }
  toast('Sessão encerrada.');
}

function fecharModal(id) {
  document.getElementById(id).classList.remove('open');
}

// ═══════════════════════════════════════════════════════════════════
// SYNC COM ADMIN (Supabase Realtime — funciona entre dispositivos)
// ═══════════════════════════════════════════════════════════════════
sb.channel('app-cliente-sync')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'servicos' }, async () => {
    await carregar();
    if (etapa === 'servico') render();
  })
  .on('postgres_changes', { event: '*', schema: 'public', table: 'config' }, async () => {
    await carregar();
    atualizarHeader();
  })
  .on('postgres_changes', { event: '*', schema: 'public', table: 'fotos_clientes' }, async () => {
    await carregarFotos();
    if (abaAtual === 'fotos') renderFotos();
  })
  .subscribe();

// fechar modal clicando fora
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); });
});

(async function init() {
  carregarSessao();
  atualizarHeader();
  await carregar();
  atualizarHeader();

})();

// ─── PWA: instalar como app na tela inicial ───────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
let promptInstalacao = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  promptInstalacao = e;
  const btn = document.getElementById('btn-instalar-app');
  if (btn) btn.style.display = 'flex';
});
function instalarApp() {
  if (!promptInstalacao) return;
  promptInstalacao.prompt();

    promptInstalacao = null;

  const btn = document.getElementById('btn-instalar-app');
  if (btn) btn.style.display = 'none';
  toast('App instalado! 🎉');
});
</script>
<script>
/* PRO Service — aviso de conexão (modo offline).
   O app abre sem internet, mas os dados (Supabase) só carregam e salvam quando a conexão volta.
   Se o app foi aberto sem internet, ele recarrega sozinho quando a conexão voltar. */
(function () {
  var abriuOffline = !navigator.onLine;
  var barra = document.createElement('div');
  barra.id = 'pro-offline-bar';
  barra.setAttribute('role', 'status');
  barra.style.cssText = 'display:none;position:fixed;left:0;right:0;bottom:0;z-index:2147483647;pointer-events:none;'
    + 'background:#FD6106;color:#fff;font:600 13px/1.4 "Segoe UI",system-ui,sans-serif;padding:9px 14px;'
    + 'text-align:center;box-shadow:0 -2px 8px rgba(0,0,0,.25)';
  function atualizar() {
    if (navigator.onLine) {
      if (abriuOffline) {
        barra.textContent = 'Conexão restabelecida — atualizando os dados…';
        barra.style.display = 'block';
        setTimeout(function () { location.reload(); }, 800);
      } else {
        barra.style.display = 'none';
      }
    } else {
      barra.textContent = 'Sem internet — o app está aberto, mas os dados só carregam e sincronizam quando a conexão voltar.';
      barra.style.display = 'block';
    }
  }
  window.addEventListener('online', atualizar);
  window.addEventListener('offline', atualizar);
  document.body.appendChild(barra);
  atualizar();
})();
</script>
